<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Shimmer Tab: brand-blue tile, shimmer stripes, a few stars, the Helium mark -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a66e6"/>
      <stop offset="0.55" stop-color="#3450d1"/>
      <stop offset="1" stop-color="#22359c"/>
    </linearGradient>
    <!-- one shimmer stripe: light at the top, fading down -->
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dfe5ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#dfe5ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="8" y="8" width="112" height="112" rx="27"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#0d1c64" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- the 112px tile scaled up to fill almost the whole icon -->
  <g transform="translate(64 64) scale(1.1) translate(-64 -64)">
  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="112" height="112" fill="url(#bg)"/>
    <!-- shimmer stripes -->
    <rect x="8" y="8" width="22.4" height="112" fill="url(#stripe)" opacity="0.55"/>
    <rect x="30.4" y="8" width="22.4" height="112" fill="url(#stripe)" opacity="0.15"/>
    <rect x="52.8" y="8" width="22.4" height="112" fill="url(#stripe)" opacity="0.9"/>
    <rect x="75.2" y="8" width="22.4" height="112" fill="url(#stripe)" opacity="0.3"/>
    <rect x="97.6" y="8" width="22.4" height="112" fill="url(#stripe)" opacity="0.7"/>
    <!-- a few stars -->
    <g fill="#fff">
      <circle cx="24" cy="26" r="1.3" opacity="0.9"/>
      <circle cx="101" cy="22" r="1.6" opacity="0.95"/>
      <circle cx="88" cy="38" r="0.9" opacity="0.7"/>
      <circle cx="35" cy="96" r="1" opacity="0.6"/>
      <circle cx="104" cy="98" r="1.2" opacity="0.75"/>
      <circle cx="20" cy="70" r="0.8" opacity="0.6"/>
    </g>
    <circle cx="64" cy="64" r="52" fill="url(#glow)"/>
    <rect x="8" y="8" width="112" height="112" fill="url(#gloss)"/>
  </g>
  <!-- inner edge highlight -->
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="26.3" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Helium mark (from Prism's HeliumLogoRaw, 256 units), 74px -->
  <g filter="url(#shadow)" transform="translate(27 27) scale(0.2891)">
    <path fill="#fff" d="M152.62 237.85L128 256L103.38 237.85L114.568 151.248L45.05 204.22L17 192L20.425 161.635L101.128 128L20.425 94.365L17 64L45.05 51.78L114.568 104.752L103.38 18.15L128 0L152.62 18.15L141.432 104.752L210.95 51.78L239 64L235.575 94.365L154.872 128L235.575 161.635L239 192L210.95 204.22L141.432 151.248L152.62 237.85Z"/>
  </g>
  </g>
</svg>
